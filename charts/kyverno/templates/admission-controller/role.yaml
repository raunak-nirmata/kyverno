{{- if .Values.admissionController.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "kyverno.admission-controller.roleName" . }}
  namespace: {{ template "kyverno.namespace" . }}
  labels:
    {{- include "kyverno.admission-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - patch
      - create
      - update
      - delete
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
    resourceNames:
      - {{ include "kyverno.config.configMapName" . }}
      - {{ include "kyverno.config.metricsConfigMapName" . }}
  # Licensing trial and grace bookkeeping. Written only by the leader.
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - update
      - patch
    resourceNames:
      - {{ include "kyverno.config.licenseStateConfigMapName" . }}
  # `create` cannot be restricted by resourceNames, so it is namespace-scoped. Only
  # needed to self-heal a deleted ConfigMap, and this Role already grants create on
  # secrets here.
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - patch
      - update
  # Allow update of Kyverno deployment annotations
  - apiGroups:
      - apps
    resources:
      - deployments
      {{- if .Values.webhooksCleanup.enabled }}
      {{- if not .Values.global.templating.enabled }}
      - deployments/scale
      {{- end }}
      {{- end }}
    verbs:
      - get
      - list
      - watch
      {{- if .Values.webhooksCleanup.enabled }}
      {{- if not .Values.global.templating.enabled }}
      - patch
      - update
      {{- end }}
      {{- end }}
{{- end -}}
