# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Chainguard Partner Release

# Publishes precompiled N4K binaries to chainguard-partners/nirmata so
# the Chainguard Factory can build hardened images from them.
#
# Triggers:
#   - Automatic: GA release tags only. A GA tag is exactly vX.Y.Z-n4k.nirmata.N with
#                nothing appended, e.g. v1.19.0-n4k.nirmata.1. Anything carrying a
#                further suffix (-rc.2, -rc1, -alpha, -beta-3, -dirty) is a
#                pre-release and does not trigger a push build.
#   - Manual:    workflow_dispatch with an explicit tag. Non-GA tags are allowed here
#                and produce a DRAFT release only, so the pipeline can be exercised
#                end to end without triggering a real Chainguard Factory build.
#
# Only GA tags are published. Everything else stops at draft, and the Chainguard
# Factory ignores Draft releases, so drafts are safe for testing.
#
# GA is matched by allowlist rather than by excluding known pre-release suffixes,
# so a new suffix convention is treated as non-GA by default instead of leaking a
# pre-release build to the Factory.
#
# Required secrets:
#   CHAINGUARD_RELEASER_APP_ID      — GitHub App ID (created in nirmata org)
#   CHAINGUARD_RELEASER_PRIVATE_KEY — GitHub App private key (.pem contents)
#
# The GitHub App must be installed on chainguard-partners/nirmata by Chainguard.
# App install URL: https://github.com/apps/nirmata-chainguard-releaser/installations/new
# See integration-plan.md §9.2 for details.

permissions:
  contents: read

on:
  push:
    tags:
      # GA tags only. The negative patterns drop anything with a suffix appended
      # after nirmata.N, which is where every pre-release marker we use lives -
      # dash-separated (-rc.2, -rc1, -alpha, -beta-3, -dirty) or dot-separated
      # (.dummy). Order matters: exclusions are evaluated after the inclusion.
      # The "Determine release type" step is the authoritative gate; these globs
      # just avoid spending a build on a tag that could never be published.
      - 'v*-n4k.nirmata.*'
      - '!v*-n4k.nirmata.*-*'
      - '!v*-n4k.nirmata.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Tag to release.
          Non-GA tags (e.g. a *-dirty or *-rc.N suffix) create a draft only — Chainguard Factory will ignore it.
          Example: v1.17.0-n4k.nirmata.3-dirty
        required: true
        type: string

env:
  # Credentials for the private Nirmata Go modules (license-guardian). Consumed by
  # .github/actions/go/install. DEPLOYMENT_* are organisation secrets.
  GOPRIVATE: github.com/nirmata
  GH_DEP_USERNAME: ${{ secrets.DEPLOYMENT_USERNAME }}
  GH_DEP_PAT: ${{ secrets.DEPLOYMENT_PAT }}

jobs:
  chainguard-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CHAINGUARD_RELEASER_APP_ID }}
          private-key: ${{ secrets.CHAINGUARD_RELEASER_PRIVATE_KEY }}
          owner: chainguard-partners
          repositories: nirmata

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-tags: true

      - name: Determine release type
        id: release-type
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # A GA tag is exactly vX.Y.Z-n4k.nirmata.N and nothing more. Matching GA
          # positively means any unrecognised or future suffix is treated as a
          # pre-release and stops at draft, rather than being published by default.
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-n4k\.nirmata\.[0-9]+$ ]]; then
            echo "is_ga=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GA tag detected ($VERSION) — will create and publish release to Chainguard Factory."
          else
            echo "is_ga=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pre-release tag detected ($VERSION) — will create a DRAFT release only. Chainguard Factory will not pick it up."
          fi

      # ubuntu-latest no longer ships enough free disk for a full Go build.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        uses: ./.github/actions/go/setup

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - name: Build cross-compiled binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make chainguard-build-binaries

      - name: Generate SBOMs
        run: make chainguard-generate-sbom

      - name: List release artifacts
        run: ls -lh .chainguard-release/

      - name: Create draft release on chainguard-partners/nirmata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: make chainguard-github-release

      - name: Publish release (GA tags only — pre-releases stop at draft)
        if: steps.release-type.outputs.is_ga == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: make chainguard-publish-release
