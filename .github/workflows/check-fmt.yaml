# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Go format

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Credentials for the private Nirmata Go modules (license-guardian). Consumed by
  # .github/actions/go/install. DEPLOYMENT_* are organisation secrets.
  GOPRIVATE: github.com/nirmata
  GH_DEP_USERNAME: ${{ secrets.DEPLOYMENT_USERNAME }}
  GH_DEP_PAT: ${{ secrets.DEPLOYMENT_PAT }}

jobs:
  check:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # ubuntu-latest no longer ships enough free disk for a full Go build.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: go fmt check
        run: make fmt-check
