# # The upload-to-codecov step is commented from this to accommodate the differences in Codecov usage
# between Kyverno (OSS) and Enterprise Kyverno. As an open-source project, Kyverno (OSS)
# can use Codecov for free, but Enterprise Kyverno incurs a cost of $4-$10 per use per month.
# To ensure green pipelines and reduce costs for Enterprise Kyverno, the strict check has 
# been loosened, and Codecov is being removed for now. This can be re-added when required.

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json


name: Codecov


on:
  push:
    branches:
      - main
      - xr1
      - release-*
  pull_request:
    branches:
      - "main"
      - "xr1"
      - "release*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: xr1
    permissions:
      contents: read
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.NIRMATA_INTERNAL_APP_ID }}
          private-key: ${{ secrets.NIRMATA_INTERNAL_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - name: Setup caches
        uses: ./.github/actions/setup-caches
        timeout-minutes: 5
        continue-on-error: true
        with:
          build-cache-key: codecov
      - name: Setup build env
        uses: ./.github/actions/setup-build-env
        timeout-minutes: 10
        with:
          free-disk-space: false
      - name: Generate Code Coverage Report
        run: make code-cov-report
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage.out
          path: coverage.out
          retention-days: 1
          if-no-files-found: error

