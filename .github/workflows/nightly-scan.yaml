name: Nightly Scan
on:
  workflow_dispatch:
    inputs:
  schedule:
    - cron: "0 8 * * *" # UTC

env:
  REGISTRY: ghcr.io

jobs:
  configure:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest 
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout to repository
        uses: actions/checkout@v3
        
      - name: Get config file 
        run: |
          curl -H "Authorization: token ${{ secrets.DEPLOYMENT_PAT }}" -o ./config.json -s https://raw.githubusercontent.com/nirmata/reusable-workflows/main/tags/enterprise_kyverno_config.json
          cat ./config.json
      - name: Set matrix variable
        id: set-matrix
        run: |
          echo "::set-output name=matrix::$(jq -c . < ./config.json)"
  
  publish-scan-branch:
    name: Publish
    runs-on: ubuntu-latest
    needs: configure
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:  ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - name: Nightly scanning
        id: scan
        uses: nirmata/reusable-workflows/.github/actions/nightly-scanning@main
        with:
          ref: ${{ matrix.ek-ref }}
          repo: ${{ github.repository }}
          github_password: ${{ secrets.GITHUB_TOKEN }}
          pcc_url: ${{ secrets.PCC_URL }}
          pcc_user: ${{ secrets.PCC_USER }}
          pcc_pass: ${{ secrets.PCC_PASS }}  

      - name: Notify failure status
        if: always() && (job.status == 'failure')
        uses: rtCamp/action-slack-notify@c33737706dea87cd7784c687dadc9adf1be59990 #v2.3.2
        env:
          SLACK_CHANNEL: cve-nightly-scan-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://cdn-icons-png.flaticon.com/512/25/25231.png
          SLACK_MESSAGE: Repository - ${{github.repository}} - ${{ matrix.ek-ref }} Environment - nightly-scan
          SLACK_TITLE: CVE discovered
          SLACK_USERNAME: Github Actions
          SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SCAN_WEBHOOK }}   