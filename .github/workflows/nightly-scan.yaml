# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Nightly-Scan

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *" # UTC, daily at 6 AM

env:
  REGISTRY: ghcr.io

jobs:
  get-branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Get release branches
        id: get-branches
        run: |
          # Get all branches matching release-*-n4k pattern, sort by version, get latest 3
          all_branches=$(curl -s 'https://api.github.com/repos/${{ github.repository }}/branches?per_page=100' | jq -r '.[].name | select(test("^release-[0-9]+\\.[0-9]+-n4k$"))' | sort -t. -k1,1nr -k2,2nr | head -n 3)
          echo "Found branches:"
          echo "$all_branches"
          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$all_branches" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set matrix
        id: set-matrix
        run: |
          # Add main branch and the release branches
          branches='["main"'
          while IFS= read -r branch; do
            if [ -n "$branch" ]; then
              branches="${branches},\"${branch}\""
            fi
          done <<< "${{ steps.get-branches.outputs.branches }}"
          branches="${branches}]"
          echo "matrix={\"branch\":${branches}}" >> $GITHUB_OUTPUT
          echo "Matrix: {\"branch\":${branches}}"

  nightly-scan:
    needs: get-branches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-branches.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Setup build env
        uses: ./.github/actions/setup-build-env
        timeout-minutes: 10

      - name: Set Image name
        run: |
          echo IMAGE_NAME="${{ github.repository_owner }}/kyverno" >> $GITHUB_ENV

      - name: Configure github.com HTTPS connection
        run: |
          echo -e "machine github.com login sync-bot password ${{ secrets.SYNC_BOT_TOKEN }}" >> ~/.netrc

      - name: Login to registry
        run: |
          echo "${{ secrets.SYNC_BOT_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build Image
        run: |
          VERSION=${{ matrix.branch }} make ko-build-kyverno
          
      - name: Tag image for scanning
        run: |
          docker tag ko.local/github.com/kyverno/kyverno/cmd/kyverno:$(git rev-parse HEAD) ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-scan-${{ matrix.branch }}

      - name: Push image for scanning
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-scan-${{ matrix.branch }}

      - name: Image scanning
        id: scan
        uses: nirmata/reusable-workflows/.github/actions/image-scanning@main
        with:
          pcc_url: ${{ secrets.PCC_URL }}
          pcc_user: ${{ secrets.PCC_USER }}
          pcc_pass: ${{ secrets.PCC_PASS }}
          image_name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-scan-${{ matrix.branch }}

      - name: Notify failure status
        if: always() && (job.status == 'failure')
        uses: rtCamp/action-slack-notify@c33737706dea87cd7784c687dadc9adf1be59990 # v2.3.2
        env:
          SLACK_CHANNEL: cve-nightly-scan-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://cdn-icons-png.flaticon.com/512/25/25231.png
          SLACK_MESSAGE: Repository - ${{ github.repository }} - Branch ${{ matrix.branch }} - nightly-scan
          SLACK_TITLE: CVE discovered
          SLACK_USERNAME: Github Actions
          SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SCAN_WEBHOOK }}
