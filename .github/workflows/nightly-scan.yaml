name: Nightly Scan
on:
  workflow_dispatch:
    inputs:
  schedule:
    - cron: "0 8 * * *" # UTC

env:
  REGISTRY: ghcr.io

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Fetch all history and tags
        
      - name: Generate image matrix
        id: set-matrix
        run: |
          # Read supported release series from config
          SUPPORTED_SERIES=($(jq -r '.supported_series[]' .github/scan-config.json))
          echo "Fetching latest tags for supported release series: ${SUPPORTED_SERIES[*]}"
          
          # Get only nirmata-specific final release tags (exclude RC/alpha/beta)
          ALL_REPO_TAGS=$(git tag --sort=-version:refname | grep -E '^v1\.[0-9]+\.[0-9]+-n4k\.nirmata\.[0-9]+$' || true)
          
          SELECTED_TAGS=()
          
          # For each supported series, find the latest patch version
          for series in "${SUPPORTED_SERIES[@]}"; do
            LATEST_IN_SERIES=$(echo "$ALL_REPO_TAGS" | grep -E "^v${series}\." | head -1 || true)
            
            if [ -n "$LATEST_IN_SERIES" ]; then
              SELECTED_TAGS+=("$LATEST_IN_SERIES")
            fi
          done

          # Check if we found any tags at all
          if [ ${#SELECTED_TAGS[@]} -eq 0 ]; then
            echo "ERROR: No nirmata tags found for supported series: ${SUPPORTED_SERIES[*]}"
            exit 1
          fi
          
          echo "Latest tags selected: ${SELECTED_TAGS[*]}"
          
          # Convert to JSON array
          TAGS_JSON=$(printf '%s\n' "${SELECTED_TAGS[@]}" | jq -R -s 'split("\n") | map(select(length > 0))')
          
          # Generate all component:tag combinations
          COMPONENTS=$(jq -r '.components[]' .github/scan-config.json)
          IMAGES=$(echo "$TAGS_JSON" | jq -c --argjson components "$(echo "$COMPONENTS" | jq -R -s 'split("\n") | map(select(length > 0))')" '
            [$components[] as $comp | .[] as $tag | "\($comp):\($tag)"]
          ')
          
          echo "matrix=$IMAGES" >> $GITHUB_OUTPUT
          echo "Scanning $(echo "$IMAGES" | jq length) image combinations"
        env:
          GH_TOKEN: ${{ github.token }}

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: configure
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image_name: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - name: Image scanning
        id: scan
        uses: nirmata/reusable-workflows/.github/actions/image-scanning@main
        with:
          image_name: ${{ matrix.image_name }}
          pcc_url: ${{ secrets.PCC_URL }}
          pcc_user: ${{ secrets.PCC_USER }}
          pcc_pass: ${{ secrets.PCC_PASS }}

      - name: Notify failure status
        if: always() && (job.status == 'failure')
        uses: rtCamp/action-slack-notify@c33737706dea87cd7784c687dadc9adf1be59990 #v2.3.2
        env:
          SLACK_CHANNEL: cve-nightly-scan-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://cdn-icons-png.flaticon.com/512/25/25231.png
          SLACK_MESSAGE: Repository - ${{github.repository}} - Image - ${{ matrix.image_name }} Environment - nightly-scan
          SLACK_TITLE: CVE discovered
          SLACK_USERNAME: Github Actions
          SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SCAN_WEBHOOK }}
