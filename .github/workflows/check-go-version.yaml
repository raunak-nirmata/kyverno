name: Check Go Version

on:
  pull_request:
    branches:
      - main
      - xr1
      - release-*

jobs:
  check-go-version:
    permissions:
      contents: read
    runs-on: xr1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Go Version
        run: bash .github/scripts/check-go-version.sh
    continue-on-error: false