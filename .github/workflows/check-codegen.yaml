# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Codegen

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Credentials for the private Nirmata Go modules (license-guardian). Consumed by
  # .github/actions/go/install. DEPLOYMENT_* are organisation secrets.
  GOPRIVATE: github.com/nirmata
  GH_DEP_USERNAME: ${{ secrets.DEPLOYMENT_USERNAME }}
  GH_DEP_PAT: ${{ secrets.DEPLOYMENT_PAT }}

jobs:
  verify-codegen-code:
    name: Verify codegen (code)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # codegen-all-code builds every binary and runs a kind cluster; ubuntu-latest
      # runs out of disk without this. Same guard as check-framework.yaml.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Generate code
        run: make codegen-all-code
      - name: Verify codegen is up to date
        run: make verify-codegen
      - name: Create codegen patch
        if: failure()
        run: |
          git diff > codegen-code.patch
          echo 'Codegen is out of date. Download the codegen-code-patch artifact, then run `git apply codegen-code.patch` and commit the result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload codegen patch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-code-patch
          path: codegen-code.patch

  verify-codegen-docs:
    name: Verify codegen (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # ubuntu-latest no longer ships enough free disk for a full Go build.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Generate api docs
        run: make codegen-all-docs
      - name: Verify codegen is up to date
        run: make verify-codegen
      - name: Create codegen patch
        if: failure()
        run: |
          git diff > codegen-docs.patch
          echo 'Codegen is out of date. Download the codegen-docs-patch artifact, then run `git apply codegen-docs.patch` and commit the result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload codegen patch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-docs-patch
          path: codegen-docs.patch
