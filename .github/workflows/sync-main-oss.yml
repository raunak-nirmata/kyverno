name: Sync main-oss from upstream and open PR

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-oss
  cancel-in-progress: false

jobs:
  sync:
    runs-on: xr1
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NIRMATA_INTERNAL_APP_ID }}
          private-key: ${{ secrets.NIRMATA_INTERNAL_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/kyverno/kyverno.git" || \
          git remote set-url upstream "https://github.com/kyverno/kyverno.git"
          git fetch upstream main

      - name: Checkout main-oss
        run: |
          git checkout main-oss
          git pull origin main-oss

      - name: Pull upstream into main-oss
        run: |
          set -e
          git pull upstream main

      - name: Push updated main-oss
        run: |
          git push origin main-oss

      - name: Check ahead status main-oss -> main
        id: ahead
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --left-right --count origin/main...origin/main-oss | awk '{print $2}')
          echo "ahead_by=${AHEAD}" >> "$GITHUB_OUTPUT"

      - name: Ensure PR from main-oss to main exists
        if: steps.ahead.outputs.ahead_by != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const head = `${owner}:main-oss`;
            const reviewers = ['jigarjoshinirmata', 'krishbajaj1609', 'mastersans'];
            
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', base, head });
            if (prs.length > 0) {
              core.info(`PR already open: #${prs[0].number}`);
              // Add reviewers to existing PR if not already added
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: prs[0].number,
                  reviewers: reviewers
                });
                core.info(`Added reviewers to existing PR #${prs[0].number}`);
              } catch (e) {
                core.warning(`Could not add reviewers: ${e.message}`);
              }
              return;
            }
            const title = 'chore: sync upstream main -> main-oss and PR to main';
            const body = [
              'Automated sync:',
              `- Pulled upstream \`kyverno/kyverno@main\` into \`main-oss\`.`,
              '- Opening PR from \`main-oss\` to \`main\`.',
              '',
              'This PR is auto-generated.',
              '',
              'Reviewers: @jigarjoshinirmata @krishbajaj1609 @mastersans'
            ].join('\n');
            const { data: pr } = await github.rest.pulls.create({ owner, repo, title, body, base, head, maintainer_can_modify: true, draft: false });
            core.info(`Created PR #${pr.number}`);
            
            // Add reviewers to the newly created PR
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pr.number,
                reviewers: reviewers
              });
              core.info(`Added reviewers to PR #${pr.number}`);
            } catch (e) {
              core.warning(`Could not add reviewers: ${e.message}`);
            }

