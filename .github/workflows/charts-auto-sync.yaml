name: Auto Sync Chart to kyverno-charts

permissions:
  contents: read
  actions: read

on:
  push:
    paths:
      - 'charts/**'
    branches:
      - release-*-n4k
  workflow_dispatch:

jobs:
  generate-token:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.generate-token.outputs.token }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.NIRMATA_INTERNAL_APP_ID }}
          private-key: ${{ secrets.NIRMATA_INTERNAL_PRIVATE_KEY }}

  resolve-target-branch:
    runs-on: ubuntu-latest
    needs: generate-token
    outputs:
      target-branch: ${{ steps.resolve.outputs.target-branch }}
    steps:
      - name: Resolve target branch name
        id: resolve
        env:
          GH_TOKEN: ${{ needs.generate-token.outputs.token }}
        run: |
          CURRENT_BRANCH="${{ github.ref_name }}"

          # Extract version (release-1.17-n4k -> 1.17)
          CURRENT_VERSION=$(echo "$CURRENT_BRANCH" | sed 's/^release-//' | sed 's/-n4k$//')

          # Fetch all release branches and extract versions
          LATEST_VERSION=$(gh api repos/nirmata/enterprise-kyverno/branches \
            --paginate \
            --jq '.[].name' \
            | grep -E '^release-[0-9]+\.[0-9]+-n4k$' \
            | sed 's/^release-//' | sed 's/-n4k$//' \
            | sort -V | tail -n 1)

          echo "Current version: $CURRENT_VERSION"
          echo "Latest version:  $LATEST_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "target-branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "target-branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          fi

  sync-chart:
    needs: [generate-token, resolve-target-branch]
    uses: nirmata/reusable-workflows/.github/workflows/chart-sync.yml@38eef6f8959df1ab74ec6b0259ffa57f63dac557 # main
    with:
      source-repo: nirmata/enterprise-kyverno
      chart-path: charts/kyverno
      chart-name: kyverno
      source-branch-name: ${{ github.ref_name }}
      target-branch-name: ${{ needs.resolve-target-branch.outputs.target-branch }}
    secrets:
      GH_TOKEN: ${{ needs.generate-token.outputs.token }}