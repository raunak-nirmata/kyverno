# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CLI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Credentials for the private Nirmata Go modules (license-guardian). Consumed by
  # .github/actions/go/install. DEPLOYMENT_* are organisation secrets.
  GOPRIVATE: github.com/nirmata
  GH_DEP_USERNAME: ${{ secrets.DEPLOYMENT_USERNAME }}
  GH_DEP_PAT: ${{ secrets.DEPLOYMENT_PAT }}

jobs:
  check:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # ubuntu-latest no longer ships enough free disk for a full Go build.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Setup TEST_GIT_BRANCH
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CANDIDATE_BRANCH="$PR_BASE_REF"
          else
            CANDIDATE_BRANCH="$REF_NAME"
          fi
          # enterprise-kyverno release branches carry an "-n4k" suffix
          # (e.g. release-1.18-n4k) that kyverno/policies branches don't
          # (e.g. release-1.18); strip it before matching upstream.
          UPSTREAM_BRANCH="${CANDIDATE_BRANCH%-n4k}"
          if git ls-remote --exit-code --heads https://github.com/kyverno/policies "$UPSTREAM_BRANCH" >/dev/null 2>&1; then
            echo "TEST_GIT_BRANCH=$UPSTREAM_BRANCH" >> $GITHUB_ENV
          else
            echo "no $UPSTREAM_BRANCH branch in kyverno/policies, falling back to main" >&2
            echo "TEST_GIT_BRANCH=main" >> $GITHUB_ENV
          fi
      - name: Test CLI
        run: |
          VERSION=${{ github.ref_name }} make test-cli
      - name: Test CLI (failures)
        run: |
          CLI_PATH=$PWD/cmd/cli/kubectl-kyverno/kubectl-kyverno
          $CLI_PATH test ./test/cli/test-fail/missing-policy && exit 1 || exit 0
          $CLI_PATH test ./test/cli/test-fail/missing-rule && exit 1 || exit 0
          $CLI_PATH test ./test/cli/test-fail/missing-resource && exit 1 || exit 0

  sync-issue:
    if: always() && github.event_name == 'push'
    needs:
      - check
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Sync issue
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}