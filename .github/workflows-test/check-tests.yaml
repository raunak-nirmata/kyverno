# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tests

permissions: {}

on:
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

env:
  # Credentials for the private Nirmata Go modules (license-guardian). Consumed by
  # .github/actions/go/install. DEPLOYMENT_* are organisation secrets.
  GOPRIVATE: github.com/nirmata
  GH_DEP_USERNAME: ${{ secrets.DEPLOYMENT_USERNAME }}
  GH_DEP_PAT: ${{ secrets.DEPLOYMENT_PAT }}

jobs:
  images:
    name: Build test images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Install Ko
        uses: ./.github/actions/tools/ko
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make docker-save-image-all
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyverno.tar
          path: kyverno.tar
          if-no-files-found: error

  cli:
    name: Build test CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make build-cli
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-kyverno
          path: cmd/cli/kubectl-kyverno/kubectl-kyverno
          if-no-files-found: error

  conformance-tests:
    name: Conformance tests
    needs:
      - images
      - cli
    permissions:
      packages: read
    uses: ./.github/workflows/tests-conformance.yaml

  conformance-policy-library-tests:
    name: Conformance tests (policy library)
    needs:
      - images
      - cli
    uses: ./.github/workflows/tests-conformance-policy-library.yaml

  k6-tests:
    name: K6 tests
    needs:
      - images
    uses: ./.github/workflows/tests-k6.yaml
