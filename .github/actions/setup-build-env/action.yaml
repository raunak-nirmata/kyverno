name: Setup build env

description: Clone repo, unshallow, setup go, cache and install tools.

inputs:
  unshallow:
    description: git unshallow
    default: 'true'
  free-disk-space:
    description: free disk space
    default: 'true'
  token:
    description: >
      GitHub token used to authenticate git for private Go module downloads
      (e.g. github.com/kyverno/*). When provided, git is configured to use
      the token for all github.com HTTPS requests so that `go mod download`
      and `go build` can resolve private dependencies.
    default: ''

runs:
  using: composite
  steps:
    - name: Configure private Go modules
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        echo "GOPRIVATE=github.com/nirmata/enterprise-kyverno" >> "$GITHUB_ENV"
        if [[ -n "${GH_TOKEN}" ]]; then
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi
    - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      if: ${{ inputs.free-disk-space == 'true' }}
      with:
        android: true
        docker-images: false
        dotnet: true
        haskell: true
        large-packages: false
        swap-storage: false
        tool-cache: true
    - shell: bash
      if: ${{ inputs.unshallow == 'true' }}
      run: |
        git fetch --prune --unshallow
    - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
      with:
        go-version-file: go.mod
        cache-dependency-path: "**/*.sum"
