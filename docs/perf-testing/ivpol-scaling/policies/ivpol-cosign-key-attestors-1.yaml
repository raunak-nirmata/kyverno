# Per-attestor-cost cell, N=1 attestor.
#
# Unlike the combined/split policies above, this points at bench/signed-all,
# where every image is signed by all three benchmark keys. So for any N in
# {1, 2, 3} here, count == len(attestors) always holds and the cache behaves
# normally - the only thing that varies across the three ivpol-cosign-key-
# attestors-N.yaml files is how many attestors are evaluated serially
# (pkg/cel/libs/imageverify/impl.go: a plain for loop, no concurrency). This
# isolates per-attestor cost from the cache-defeat story in
# ivpol-cosign-key-combined.yaml.
apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-bench-cosign-key-attestors-1
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    mode: Kubernetes
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "registry.bench-registry.svc.cluster.local:5000/bench/signed-all:*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors:
    - name: a
      cosign:
        key:
          data: |
KEY_A_PLACEHOLDER
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.a])).all(count, count > 0)
      message: "every container image must carry a valid signature from attestor a"
