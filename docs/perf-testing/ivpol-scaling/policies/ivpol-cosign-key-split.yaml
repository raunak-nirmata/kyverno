# Two-key-attestor ImageValidatingPolicy, split form - the partial workaround.
#
# Splitting the combined call into two single-attestor calls, ORed, restores
# the cache for whichever population is checked first: an image signed only
# by key A gives count == len(attestors) == 1 on the first call and caches
# normally. But the only two cache writes in the engine
# (pkg/cel/libs/imageverify/impl.go:203, :318) both store `true` and both
# require count == len(attestors) - a *failed* verification is never cached.
# So an image signed only by key B still re-walks attestor A on every
# admission, fails it, and caches nothing there. Order matters: whichever
# attestor is listed first is the one that gets the free cache hit.
apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-bench-cosign-key-split
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    mode: Kubernetes
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "registry.bench-registry.svc.cluster.local:5000/bench/signed:*"
    - glob: "registry.bench-registry.svc.cluster.local:5000/bench/signed-b:*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors:
    - name: a
      cosign:
        key:
          data: |
KEY_A_PLACEHOLDER
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
    - name: b
      cosign:
        key:
          data: |
KEY_B_PLACEHOLDER
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.a]) > 0 ||
          verifyImageSignatures(image, [attestors.b]) > 0
        ).all(ok, ok)
      message: "every container image must carry a valid signature from attestor a or b"
