# Key-based cosign ImageValidatingPolicy for the ivpol scaling benchmark.
#
# Key-based rather than keyless on purpose. A keyless attestor puts Fulcio and
# Rekor on the admission path, which means every measured request carries
# latency from a public service nobody here controls. That is a legitimate thing
# to measure - it is what many production setups actually do - but it belongs in
# its own cell, not in the baseline that every other number is compared against.
# See ivpol-cosign-keyless.yaml.
#
# The key placeholder below is substituted by ivpol-run.sh from
# registry/keys/cosign.pub. The policy is applied with the key inlined, and the
# applied copy is archived per cell so a result can be traced to the exact policy
# that produced it. The placeholder token deliberately appears exactly once in
# this file; the renderer asserts that, because a second occurrence (in a comment,
# say) would be substituted too and would silently corrupt the manifest.
#
# timeoutSeconds is pinned deliberately. It has two effects that both matter:
#
#   1. It decides the webhook shape. A policy that sets timeoutSeconds is
#      classified fine-grained (pkg/controllers/webhook/validating.go:35) and
#      gets its own webhook endpoint. That is the shape real ivpol policies take
#      - 40 of the 55 in the conformance suite set it - so it is the honest
#      default here, even though it means one policy per engine call.
#   2. It defines the failure mode the concurrency ramp measures. Without a
#      pinned value the saturation point would move with whatever the chart
#      defaults to in each version, and a ramp chart whose cliff depends on the
#      version's default is not comparing engines.
apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-bench-cosign-key
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    mode: Kubernetes
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "registry.bench-registry.svc.cluster.local:5000/bench/signed:*"
  validationConfigurations:
    # Digest mutation and the digest requirement are both off. Each would add
    # work that is not signature verification, and the sweep is measuring the
    # per-image fetch-and-verify path, not digest rewriting.
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors:
    - name: cosign
      cosign:
        key:
          data: |
PUBLIC_KEY_PLACEHOLDER
        # The benchmark images are signed offline against a local key: there is
        # no Rekor entry for them, because putting a public transparency log on
        # the admission path would add latency nobody here controls to every
        # measured request. Without this, Kyverno finds the signature and then
        # fails it with "offline verification failed" while trying to confirm a
        # log entry that was never made.
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    # Every matched image must carry a valid signature from the benchmark key.
    # Written as an explicit count comparison rather than a boolean so a partial
    # verification - some images verified, some not - fails loudly instead of
    # passing on the first success.
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(count, count > 0)
      message: "every container image must carry a valid benchmark cosign signature"
