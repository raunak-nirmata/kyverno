apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: clusterpolicy-namespaced-wildcard
spec:
  # asserts against the shared resource validating webhook, which the sibling
  # `clusterpolicy` test also registers a wildcard rule in
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait policy ready
    use:
      template: ../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: require-labels-namespaced-wildcard
  - name: step-02
    try:
    - assert:
        file: webhooks.yaml
