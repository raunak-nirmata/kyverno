    - name: secret
      value: tenant-foreign/regcred
    try:
    - create:
        file: image-policy.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'instead of policy namespace')): true
  - name: image-policy-installation
    bindings:
    - name: name
      value: image-policy-installation
    - name: secret
      value: kyverno/regcred
    try:
    - create:
        file: image-policy.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'instead of policy namespace')): true
  - name: attestor-bare
    bindings:
    - name: name
      value: attestor-bare
    - name: secret
      value: regcred
    try:
    - create:
        file: attestor.yaml
  - name: attestor-local
    bindings:
    - name: name
      value: attestor-local
    - name: secret
      value: (join('/', [$namespace, 'regcred']))
    try:
    - create:
        file: attestor.yaml
  - name: attestor-foreign
    bindings:
    - name: name
      value: attestor-foreign
    - name: secret
      value: tenant-foreign/regcred
    try:
    - create:
        file: attestor.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'instead of policy namespace')): true
  - name: attestor-installation
    bindings:
    - name: name
      value: attestor-installation
