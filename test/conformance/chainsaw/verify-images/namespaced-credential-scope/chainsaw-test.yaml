        - check:
            ($error != null): true
            (contains($error, 'instead of policy namespace')): true
  - name: image-policy-bare
    bindings:
    - name: name
      value: image-policy-bare
    - name: secret
      value: regcred
    try:
    - create:
        file: image-policy.yaml
  - name: image-policy-local
